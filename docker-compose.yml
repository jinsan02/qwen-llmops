services:
  db:
    image: redis:7.2-alpine
    container_name: qwen-db
    restart: always
    ports:
      - "6380:6379"
    networks:
      - qwen-network

  # 기본(ONNX) M5 — onnxruntime, SLM_BACKEND=05b/15b
  ai-qwen:
    build:
      context: .
      target: cpu-runtime
    container_name: qwen-ai
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - REDIS_HOST=db
      - SLM_MIN_INTERVAL_MS=5000
      - ORT_USE_GPU=0
      - SLM_BACKEND=${SLM_BACKEND:-05b}
      - SLM_MODEL=${SLM_MODEL:-qwen_05b}
    volumes:
      - ./volumes/models:/app/models
    command: ["python", "service/qwen_service.py"]
    networks:
      - qwen-network

  # GGUF(llama.cpp) M5 — `docker compose --profile gguf up ai-qwen-gguf`
  # 배포 후보 = Q5_K_M (합성 스냅샷셋 162/164; 경계 서맥 HR=36/40 케이스 통과).
  # RPi5 실기 메모리/latency는 미검증. 롤백 후보는 SLM_MODEL→qwen_15b_gguf(Q4).
  ai-qwen-gguf:
    build:
      context: .
      target: gguf-runtime
    container_name: qwen-ai-gguf
    restart: always
    profiles: ["gguf"]
    depends_on:
      - db
    env_file: .env
    environment:
      - REDIS_HOST=db
      - SLM_MIN_INTERVAL_MS=5000
      - SLM_BACKEND=gguf
      - SLM_MODEL=qwen_15b_gguf_q5
      - SLM_TOKENIZER=qwen_15b
      - QWEN_GGUF_THREADS=4
    volumes:
      - ./volumes/models:/app/models
    command: ["python", "service/qwen_service.py"]
    networks:
      - qwen-network

  # M5 서빙 API (FastAPI) — `docker compose --profile api up api`
  # POST /evaluate (M1~M4 → 응급지수 게이트 + M5) · GET /health · /metrics · /docs
  api:
    build:
      context: .
      target: gguf-runtime
    container_name: qwen-api
    restart: always
    profiles: ["api"]
    env_file: .env
    environment:
      - SLM_BACKEND=${SLM_BACKEND:-gguf}
      - SLM_MODEL=${SLM_MODEL:-qwen_15b_gguf_q5}
      - SLM_TOKENIZER=qwen_15b
      - MODEL_PATH=/app/models
      - QWEN_GGUF_THREADS=4
    ports:
      # 같은 호스트에서 rp5(api :8000)와 함께 띄우면 API_PORT로 호스트 포트만 바꾼다.
      # Prometheus는 도커 내부망에서 api:8000을 긁으므로 영향 없음.
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./volumes/models:/app/models
    command: ["uvicorn", "service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - qwen-network

  # ── 모니터링 풀스택 (opt-in) — `docker compose --profile monitoring up -d` ──
  # RPi5 제약 반영: 기본 배포엔 안 뜸(profile), 보존 7d/512MB 상한으로 SD 마모 제한.
  # 운영 권장: 이 스택을 오프디바이스에서 띄우고 Pi의 :8000/metrics를 원격 스크래핑.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: qwen-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - qwen-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: qwen-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      # 데이터소스·대시보드는 코드로 프로비저닝(클릭 설정 금지)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - qwen-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  qwen-network:
    driver: bridge
